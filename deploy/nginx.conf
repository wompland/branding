server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Behind Caddy: keep redirects relative so they use the public host and scheme.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;

  # Markdown and llms.txt read as UTF-8 text in the browser instead of downloading.
  charset utf-8;
  charset_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;
  location ~ \.md$ {
    default_type text/markdown;
    add_header Cache-Control "public, max-age=300";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  # Hashed build assets never change.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Brand files keep stable names; let clients revalidate after a redeploy.
  location /brands/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
    add_header Access-Control-Allow-Origin "*";
  }
}
